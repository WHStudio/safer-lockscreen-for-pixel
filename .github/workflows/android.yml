name: Build debug APK

on:
  push:
  pull_request:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # sdkmanager publishes API 37 as platforms;android-37.0 (installed under
      # platforms/android-37.0). There is no platforms;android-37 package.
      # AGP 9.1 also invokes Build-Tools 36 by default, so that package is installed
      # alongside Build-Tools 37. Licenses are accepted inside setup-android.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: safer-lockscreen-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
